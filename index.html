<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./SRC/output.css" rel="stylesheet" />
    <title>MERCOENERGY - Comparador</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="./SRC/IMG/mercoguadiana_grupo_logo.png"
    />
    <script src="./SRC/index.js" defer></script>
  </head>
  <body class="bg-gray-100">
    <!-- NAVBAR -->
    <header class="fixed top-0 w-full z-50 shadow-md">
      <nav class="bg-white border-b border-green-600 shadow-lg">
        <div class="max-w-screen-xl mx-auto p-4 flex items-center">
          <a
            href="https://mercoguadiana.github.io/MERCOENERGY-COMPARATOR/"
            class="flex items-center space-x-3"
          >
            <img src="./SRC/IMG/MERCOENERGY-LOGO.png" class="h-12" alt="Logo" />
          </a>
        </div>
      </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main class="pt-32 px-4 sm:px-6 lg:px-10 w-full">
      <div class="w-full flex flex-col items-center min-h-screen">
        <div class="w-full flex justify-center mb-10">
          <img
            src="./SRC/IMG/MERCOENERGY-LOGO.png"
            class="h-28 sm:h-32 md:h-36 lg:h-40 xl:h-44 object-contain"
            alt="Logo Central"
          />
        </div>

        <div
          class="container mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 w-full mt-10"
          id="container"
        >
          <!-- Las tarjetas se insertarán aquí con JS -->
        </div>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-green-700 w-full mt-20 shadow-xl">
      <div class="max-w-screen-xl mx-auto px-4 py-4">
        <div class="flex justify-center items-center">
          <p class="text-white text-sm">
            &copy; 2025 MERCOENERGY. All rights reserved.
          </p>
        </div>
      </div>
    </footer>
  </body>
</html>
